# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard.
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
      - primary
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      round_corners: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 28
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
        - home
        - quick_launch
        - windows_desktops
        - active_window
      center:
        - open_meteo
        - clock
        - update_check
      right:
        - audio_visualizer
        - media
        - systray
        - system-monitor
        - microphone
        - volume
        - notifications
        - power_menu
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span></span>"
      menu_list:
        - title: User Home
          path: "~"
        - title: Download
          path: ~\Downloads
        - title: Documents
          path: ~\Documents
        - title: Pictures
          path: ~\Pictures
      system_menu: true
      power_menu: true
      blur: true
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -12
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: "{%a %d %b %H:%M}"
      label_alt: "{%A, %d de %B de %Y}"
      tooltip: true
      locale: "pt_BR"
      update_interval: 1000
      timezones: []
      icons: {}
      alarm_icons:
        enabled: ""
        disabled: ""
        snooze: ""
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "center"
        direction: "down"
        offset_top: 12
        offset_left: 0
        country_code: "BR"
        subdivision: null
        show_holidays: true
        holiday_color: "#5cb85c"
        show_week_numbers: false
        show_years: true
        extended: false
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span>{level}
      tooltip: true
      icons:
        muted: ""
        "10": ""
        "30": ""
        "60": ""
        "100": ""
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: ""
          toggle_up: ""
  system-monitor:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "system-monitor"
      widgets: ["cpu", "memory", "gpu"]
      collapse_options:
        enabled: true
        expanded_label: ""
        collapsed_label: ""
        label_position: "right"
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span></span>"
      label_alt: "{count} notifications"
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  update_check:
    type: "yasb.update_check.UpdateCheckWidget"
    options:
      winget_update:
        enabled: true
        label: "󰚰 {count}"
        interval: 240
        tooltip: true
      windows_update:
        enabled: false
      scoop_update:
        enabled: false
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\uE7E8</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock: ["󰍁", Lock]
        signout: ["󰍃", Sign out]
        sleep: ["󰤄", Sleep]
        hibernate: ["󰤁", Hibernate]
        restart: ["󰑓", Restart]
        shutdown: ["󰤆", Shut Down]
        cancel: ["", Cancel]
  windows_desktops:
    type: "yasb.windows_desktops.WorkspaceWidget"
    options:
      label_workspace_btn: ""
      label_workspace_active_btn: ""
      enable_scroll_switching: true
      callbacks:
        on_left: activate_workspace
        on_middle: do_nothing
        on_right: toggle_context_menu
  cpu:
    type: yasb.cpu.CpuWidget
    options:
      label: "<span></span> {info[percent][total]}%"
      label_alt: "{info[freq][current]} MHz"
      update_interval: 2000
      hide_decimal: true
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  memory:
    type: yasb.memory.MemoryWidget
    options:
      label: "<span></span> {virtual_mem_free}"
      label_alt: "<span></span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
      update_interval: 5000
      hide_decimal: true
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span></span> {info[utilization]}%"
      label_alt: "<span></span> {info[temp]}°C | {info[mem_used]} / {info[mem_total]}"
      update_interval: 2000
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
  quick_launch:
    type: yasb.quick_launch.QuickLaunchWidget
    options:
      label: "<span></span>"
      search_placeholder: Search applications...
      max_results: 30
      show_icons: true
      icon_size: 16
      compact_text: true
      providers:
        apps:
          enabled: true
          prefix: "*"
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
      popup:
        width: 720
        height: 480
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        dark_mode: true
      callbacks:
        on_left: toggle_quick_launch
      keybindings:
        - keys: alt+space
          action: toggle_quick_launch
          screen: primary
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: "{win[title]}"
      label_alt: "[class_name='{win[class_name]}' exe='{win[process][name]}' hwnd={win[hwnd]}]"
      label_no_window: ""
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: "..."
      monitor_exclusive: false
  systray:
    type: yasb.systray.SystrayWidget
    options:
      class_name: systray
      label_collapsed: ""
      label_expanded: ""
      label_position: right
      pin_click_modifier: ctrl
      show_unpinned: false
      show_battery: false
      show_volume: false
      icon_size: 16
      use_hook: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0
  open_meteo:
    type: "yasb.open_meteo.OpenMeteoWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: "metric"
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      icons:
        sunnyDay: ""
        clearNight: ""
        cloudyDay: ""
        cloudyNight: ""
        drizzleDay: "󰙾"
        drizzleNight: "󰙾"
        rainyDay: ""
        rainyNight: ""
        snowyDay: ""
        snowyNight: ""
        foggyDay: ""
        foggyNight: ""
        thunderstormDay: ""
        thunderstormNight: ""
        default: ""
      weather_card:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        icon_size: 48
        show_hourly_forecast: true
        time_format: "24h"
        hourly_point_spacing: 76
        hourly_icon_size: 24
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: "#8EAEE8"
        current_line_width: 1
        current_line_style: "dot"
        hourly_gradient:
          enabled: true
          top_color: "#8EAEE8"
          bottom_color: "#2A3E68"
        hourly_forecast_buttons:
          enabled: true
          default_view: "temperature"
          temperature_icon: "󰖙"
          rain_icon: "󰖖"
          snow_icon: "󰖘"
        weather_animation:
          enabled: true
          snow_overrides_rain: true
          temp_line_animation_style: both
          rain_effect_intensity: 1.0
          snow_effect_intensity: 1.0
          scale_with_chance: true
        offset_top: 6
        offset_left: 0
      class_name: ""
      forecast_days: 7
      keybindings: []
  microphone:
    type: yasb.microphone.MicrophoneWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span> {level}
      mute_text: mute
      icons:
        normal: ""
        muted: ""
      mic_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
      callbacks:
        on_left: toggle_mic_menu
        on_middle: toggle_label
        on_right: toggle_mute
  media:
    type: yasb.media.MediaWidget
    options:
      label: "{title}{s}{artist}"
      label_alt: "{artist} - {title}"
      separator: " - "
      class_name: ""
      hide_empty: true
      callbacks:
        on_left: toggle_media_menu
        on_middle: toggle_play_pause
        on_right: toggle_label
      max_field_size:
        label: 20
        label_alt: 30
        truncate_whole_label: true
      show_thumbnail: true
      controls_only: false
      controls_left: true
      controls_hide: false
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 16
      symmetric_corner_radius: false
      thumbnail_edge_fade: true
      icons:
        prev_track: ""
        next_track: ""
        play: ""
        pause: ""
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        max_source_size: 16
        show_source: true
        show_volume_slider: true
      media_menu_icons:
        play: ""
        pause: ""
        prev_track: ""
        next_track: ""
        mute: ""
        unmute: ""
      scrolling_label:
        enabled: true
        update_interval_ms: 40
        style: bounce
        separator: " | "
        label_padding: 0
        always_scroll: false
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      progress_bar:
        enabled: true
        alignment: center
  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      source: "auto"
      style: "bars"
      height: 16
      smoothness: 55
      sensitivity: 50
      auto_gain: true
      framerate: 60
      freq_min: 500
      freq_max: 12000
      hide_idle: true
      hide_idle_after: 2000
      channels: "mono"
      mono_option: "average"
      reverse: false
      mirror: false
      bars:
        count: 24
        width: 2
        gap: 4
